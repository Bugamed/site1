name: Build and Deploy Hugo to Timeweb S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build site
        run: hugo

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG }}
          EOF

      - name: Check connection
        run: |
          rclone lsd timeweb:

      - name: Upload website
        run: |
          rclone sync public timeweb:${{ secrets.TIMEWEB_BUCKET }} \
            --progress \
            --delete-during

      - name: Verify upload
        run: |
          rclone ls timeweb:${{ secrets.TIMEWEB_BUCKET }}
