name: Build and Deploy Hugo to Timeweb S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build site
        run: hugo

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Check AWS CLI
        run: aws --version

      - name: Test S3 connection
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIMEWEB_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIMEWEB_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.TIMEWEB_REGION }}
        run: |
          echo "Listing buckets..."
          aws s3 ls \
            --endpoint-url="${{ secrets.TIMEWEB_ENDPOINT }}"

      - name: Upload website
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIMEWEB_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIMEWEB_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.TIMEWEB_REGION }}
        run: |
          aws s3 sync public/ s3://${{ secrets.TIMEWEB_BUCKET }} \
            --endpoint-url="${{ secrets.TIMEWEB_ENDPOINT }}" \
            --delete

      - name: Verify uploaded files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIMEWEB_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIMEWEB_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.TIMEWEB_REGION }}
        run: |
          aws s3 ls s3://${{ secrets.TIMEWEB_BUCKET }} \
            --endpoint-url="${{ secrets.TIMEWEB_ENDPOINT }}"
